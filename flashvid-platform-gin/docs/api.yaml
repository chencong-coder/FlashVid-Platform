  # ==================== 上传模块 ====================
  /upload:
    post:
      tags:
        - 上传
      summary: 上传文件
      description: 上传图片、视频或音频文件
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - file_type
              properties:
                file:
                  type: string
                  format: binary
                  description: 文件数据
                file_type:
                  type: string
                  enum: [image, video, audio]
                  description: 文件类型
                  example: video
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          file_url:
                            type: string
                            format: uri
                            description: 文件URL
                            example: http://localhost:8089/static/video/1785396664197888300.mp4
                          file_size:
                            type: integer
                            format: int64
                            description: 文件大小（字节）
                            example: 5242880
                          file_type:
                            type: string
                            description: 文件类型
                            example: video
                          duration:
                            type: integer
                            description: 视频/音频时长（秒），本地存储暂不解析，固定返回 0
                            example: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: 文件过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - BearerAuth: []


