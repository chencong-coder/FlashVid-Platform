            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              $ref: '#/components/schemas/Music'
                          total:
                            type: integer
                            format: int64
                            description: 总条数
                            example: 12
                          page:
                            type: integer
                            description: 当前页码
                            example: 1
                          pageSize:
                            type: integer
                            description: 每页数量
                            example: 20

  /conversations:
    get:
      tags:
        - 私信
      summary: 获取会话列表
      description: 获取当前用户的会话列表（offset 分页，按最后消息时间倒序）。需要登录
      operationId: getConversations
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              $ref: '#/components/schemas/Conversation'
                          total:
                            type: integer
                            format: int64
                            description: 会话总数
                            example: 12
                          page:
                            type: integer
                            description: 当前页码
                            example: 1
                          pageSize:
                            type: integer
                            description: 每页数量
                            example: 20
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - BearerAuth: []

  /conversations/{userId}/messages:
    get:
      tags:
        - 私信
      summary: 获取对话消息
      description: 获取与指定用户的私信消息列表（游标分页，按创建时间倒序，最新在前）。需要登录
      operationId: getConversationMessages
      parameters:
        - name: userId
          in: path
          required: true
          description: 对方用户ID
          schema:
            type: integer
            format: int64
            example: 456
        - name: cursor
          in: query
          description: 游标（上一页最后一条消息的创建时间，格式 2006-01-02 15:04:05），首次不传
          schema:
            type: string
            example: '2024-01-01 12:00:00'
        - name: count
          in: query
          description: 每页数量，默认20，最大50
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            example: 20
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          messages:
                            type: array
                            items:
                              $ref: '#/components/schemas/Message'
                          nextCursorToken:
                            type: string
                            description: 下一页游标，hasMore为false时为空
                            example: '2024-01-01 11:00:00'
                          hasMore:
                            type: boolean
                            description: 是否还有更多
                            example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /conversations/{userId}/read:
    put:
      tags:
        - 私信
      summary: 标记会话已读
      description: 将与指定用户的会话中所有未读消息标记为已读。需要登录
      operationId: markConversationRead
      parameters:
        - name: userId
          in: path
          required: true
          description: 对方用户ID
          schema:
            type: integer
            format: int64
            example: 456
      responses:
        '200':
          description: 标记成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          readCount:
                            type: integer
                            description: 本次标记为已读的消息数
                            example: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - BearerAuth: []

  /messages:
    post:
      tags:
        - 私信
      summary: 发送私信
      description: 向指定用户发送私信。messageType=1 文本时 content 必填；messageType=2/3 图片/视频时 mediaUrl 必填（先经上传接口获取）。需要登录
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - toUserId
                - messageType
              properties:
                toUserId:
                  type: integer
                  format: int64
                  description: 接收方用户ID
                  example: 456
                messageType:
                  type: integer
                  description: 消息类型：1-文本 2-图片 3-视频
                  enum: [1, 2, 3]
                  example: 1
                content:
                  type: string
                  description: 文本内容，messageType=1 时必填
                  example: 在吗？
                mediaUrl:
                  type: string
                  format: uri
                  description: 媒体地址，messageType=2/3 时必填
                  example: ''
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /messages/{id}:
    delete:
      tags:
        - 私信
      summary: 删除消息
      description: 删除自己发送或接收的某条消息（仅对自己隐藏）。需要登录
      operationId: deleteMessage
      parameters:
        - name: id
          in: path
          required: true
          description: 消息ID
          schema:
            type: integer
            format: int64
            example: 1001
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /messages/unread-count:
    get:
      tags:
        - 私信
      summary: 获取未读总数
      description: 获取当前用户所有会话的未读私信总数，用于入口红点。需要登录
      operationId: getUnreadCount
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          unreadCount:
                            type: integer
                            description: 未读私信总数
                            example: 8
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - BearerAuth: []


  # ==================== 播放列表模块 ====================
  /playlists:
    get:
      tags:
        - 播放列表
      summary: 获取我的播放列表
      description: 获取当前登录用户的所有播放列表（按创建时间倒序）
      operationId: getMyPlaylists
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          playlists:
                            type: array
                            items:
                              $ref: '#/components/schemas/PlaylistInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - BearerAuth: []

    post:
      tags:
        - 播放列表
      summary: 创建播放列表
      description: 创建一个新的自定义播放列表
      operationId: createPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  maxLength: 50
                  description: 播放列表标题
                  example: 我最喜欢的视频
                description:
                  type: string
                  maxLength: 500
                  description: 描述（可选）
                  example: 收藏的精彩视频
                coverUrl:
                  type: string
                  format: uri
                  description: 封面URL（可选）
                  example: https://cdn.flashvid.com/cover/playlist.jpg
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          playlist:
                            $ref: '#/components/schemas/PlaylistInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - BearerAuth: []

  /playlists/{id}:
    put:
      tags:
        - 播放列表
      summary: 更新播放列表
      description: 更新播放列表的标题、描述或封面
      operationId: updatePlaylist
      parameters:
        - name: id
          in: path
          required: true
          description: 播放列表ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 50
                  example: 新标题
                description:
                  type: string
                  maxLength: 500
                  example: 新描述
                coverUrl:
                  type: string
                  format: uri
                  example: https://cdn.flashvid.com/cover/new.jpg
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth: []

    delete:
      tags:
        - 播放列表
      summary: 删除播放列表
      description: 删除指定播放列表及其所有视频关联
      operationId: deletePlaylist
      parameters:
        - name: id
          in: path
          required: true
          description: 播放列表ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /playlists/{id}/videos:
    get:
      tags:
        - 播放列表
      summary: 获取播放列表内的视频
      description: 游标分页获取指定播放列表内的视频列表（按加入时间倒序）
      operationId: getPlaylistVideos
      parameters:
        - name: id
          in: path
          required: true
          description: 播放列表ID
          schema:
            type: integer
            format: int64
        - name: cursor
          in: query
          required: false
          description: 游标（上一页最后一条记录的 created_at，格式 "yyyy-MM-dd HH:mm:ss"，首次请求不传）
          schema:
            type: string
            example: "2026-08-01 12:00:00"
        - name: count
          in: query
          required: false
          description: 每页数量，默认 20，最大 50
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          playlist:
                            $ref: '#/components/schemas/PlaylistInfo'
                          videos:
                            type: array
                            items:
                              $ref: '#/components/schemas/Video'
                          nextCursor:
                            type: string
                            nullable: true
                            description: 下一页游标，为 null 表示没有更多数据
                            example: "2026-07-20T08:30:00Z"
                          hasMore:
                            type: boolean
                            description: 是否还有更多数据
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth: []

    post:
      tags:
        - 播放列表
      summary: 添加视频到播放列表
      description: 将指定视频添加到播放列表（幂等，重复添加返回已在列表错误）
      operationId: addVideoToPlaylist
      parameters:
        - name: id
          in: path
          required: true
          description: 播放列表ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - videoId
              properties:
                videoId:
                  type: integer
                  format: int64
                  description: 视频ID
                  example: 12345
      responses:
        '200':
          description: 添加成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 视频已在播放列表中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
      security:
        - BearerAuth: []

  /playlists/{id}/videos/{videoId}:
    delete:
      tags:
        - 播放列表
      summary: 从播放列表移除视频
      description: 将指定视频从播放列表中移除
      operationId: removeVideoFromPlaylist
      parameters:
        - name: id
          in: path
          required: true
          description: 播放列表ID
          schema:
            type: integer
            format: int64
        - name: videoId
          in: path
          required: true
          description: 视频ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 移除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth: []


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Token 认证，格式：Bearer <token>

  parameters:
    Page:
      name: page
      in: query
      description: 页码，从1开始
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1

    PageSize:
      name: pageSize
      in: query
      description: 每页数量
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20

    Cursor:
      name: cursor
      in: query
      description: 游标，用于分页
      schema:
        type: string
        example: next_cursor_token

    Count:
      name: count
      in: query
      description: 返回数量
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10

    Sort:
      name: sort
      in: query
      description: 排序方式
      schema:
        type: string
        enum: [latest, popular]
        default: latest
        example: latest

  schemas:
    Response:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: 响应码，0表示成功
          example: 0
        message:
          type: string
          description: 响应消息
          example: success
        data:
          type: object
          nullable: true
          description: 响应数据

    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: 当前页码
          example: 1
        pageSize:
          type: integer
          description: 每页数量
          example: 20
        total:
          type: integer
          format: int64
          description: 总记录数
          example: 100
        totalPages:
          type: integer
          description: 总页数
          example: 5

    UserProfile:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: 用户ID
          example: 123456
        username:
          type: string
          description: 用户名
          example: testuser
        nickname:
          type: string
          description: 昵称
          example: 测试用户
        avatar:
          type: string
          format: uri
          description: 头像URL
          example: https://cdn.flashvid.com/avatar/123456.jpg
        bio:
          type: string
          description: 个人简介
          example: 这是我的个人简介
        gender:
          type: string
          description: 性别 0-未知 1-男 2-女
          example: '1'
        birthday:
          type: string
          format: date
          description: 生日
          example: '2000-01-01'
        city:
          type: string
          description: 城市
          example: 深圳
        phone:
          type: string
          description: 手机号
          example: '13800138000'
        email:
          type: string
          format: email
          description: 邮箱
          example: test@example.com
        followersCount:
          type: integer
          description: 粉丝数
          example: 1000
        followingCount:
          type: integer
          description: 关注数
          example: 500
        videosCount:
          type: integer
          description: 发布视频数
          example: 50
        likesCount:
          type: integer
          description: 获赞数
          example: 10000
        createdAt:
          type: string
          format: date-time
          description: 注册时间
          example: '2024-01-01T12:00:00Z'


    Video:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 视频ID
          example: 12345
        title:
          type: string
          description: 视频标题
          example: 我的第一个短视频
        description:
          type: string
          description: 视频描述
          example: 这是一个测试视频
        coverUrl:
          type: string
          format: uri
          description: 封面URL
          example: https://cdn.flashvid.com/cover/12345.jpg
        videoUrl:
          type: string
          format: uri
          description: 视频URL
          example: https://cdn.flashvid.com/video/12345.mp4
        duration:
          type: integer
          description: 视频时长（秒）
          example: 30
        width:
          type: integer
          description: 视频宽度
          example: 1080
        height:
          type: integer
          description: 视频高度
          example: 1920
        musicId:
          type: integer
          format: int64
          description: 背景音乐ID
          example: 456
        city:
          type: string
          description: 城市
          example: 深圳
        topics:
          type: array
          items:
            type: string
          description: 话题标签
          example: ['旅行', '美食']
        author:
          type: object
          description: 作者信息
          properties:
            id:
              type: integer
              format: int64
              example: 123
            username:
              type: string
              example: author
            nickname:
              type: string
              example: 作者
            avatar:
              type: string
              format: uri
              example: https://cdn.flashvid.com/avatar/123.jpg
        stats:
          type: object
          description: 统计信息
          properties:
            viewCount:
              type: integer
              description: 播放数
              example: 10000
            likeCount:
              type: integer
              description: 点赞数
              example: 1000
            commentCount:
              type: integer
              description: 评论数
              example: 100
            shareCount:
              type: integer
              description: 分享数
              example: 50
            favoriteCount:
              type: integer
              description: 收藏数
              example: 200
        publishedAt:
          type: string
          description: 发布时间（格式：2006-01-02 15:04:05）
          example: '2024-01-01 12:00:00'

    VideoDetail:
      allOf:
        - $ref: '#/components/schemas/Video'
        - type: object
          properties:
            music_id:
              type: integer
              format: int64
              description: 音乐ID
              example: 456
            location:
              type: string
              description: 具体位置
              example: 南山区
            topics:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                    example: 1
                  name:
                    type: string
                    example: 旅行
            published_at:
              type: string
              format: date-time
              description: 发布时间
              example: '2024-01-01T12:00:00Z'


    Comment:
      type: object
      description: 一级评论（TikTok风格，回复通过 GET /comments/{id}/replies 单独加载）
      properties:
        id:
          type: integer
          format: int64
          description: 评论ID
          example: 789
        content:
          type: string
          description: 评论内容
          example: 这个视频太棒了！
        user:
          $ref: '#/components/schemas/CommentUser'
        likeCount:
          type: integer
          format: int32
          description: 点赞数
          example: 10
        replyCount:
          type: integer
          format: int32
          description: 回复数（折叠，点击展开时调用 /replies 接口）
          example: 2
        isLiked:
          type: boolean
          description: 当前用户是否已点赞（未登录时为 false）
          example: false
        isAuthored:
          type: boolean
          description: 是否为视频作者发表
          example: false
        replies:
          type: array
          description: 回复列表占位（始终为空数组，通过 GET /comments/{id}/replies 获取）
          items:
            $ref: '#/components/schemas/Reply'
          example: []
        createdAt:
          type: string
          description: 评论时间（格式：2006-01-02 15:04:05）
          example: '2024-01-01 12:00:00'

    Reply:
      type: object
      description: 评论回复
      properties:
        id:
          type: integer
          format: int64
          description: 回复ID
          example: 790
        content:
          type: string
          description: 回复内容
          example: 同意！
        user:
          $ref: '#/components/schemas/CommentUser'
        replyTo:
          type: object
          description: 被回复的用户（防御性，replyToUserId=0 时为空对象）
          nullable: true
          properties:
            id:
              type: integer
              format: int64
              example: 123
            nickname:
              type: string
              example: 评论者
        likeCount:
          type: integer
          format: int32
          description: 点赞数
          example: 5
        isLiked:
          type: boolean
          description: 当前用户是否已点赞（未登录时为 false）
          example: false
        createdAt:
          type: string
          description: 回复时间（格式：2006-01-02 15:04:05）
          example: '2024-01-01 12:05:00'

    CommentUser:
      type: object
      description: 评论/回复用户信息
      properties:
        id:
          type: integer
          format: int64
          example: 123
        username:
          type: string
          example: commenter
        nickname:
          type: string
          example: 评论者
        avatar:
          type: string
          format: uri
          example: https://cdn.flashvid.com/avatar/123.jpg

    Topic:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 话题ID
          example: 1
        name:
          type: string
          description: 话题名称
          example: 旅行
        description:
          type: string
          description: 话题描述
          example: 分享你的旅行故事
        coverUrl:
          type: string
          format: uri
          description: 话题封面
          example: https://cdn.flashvid.com/topic/1.jpg
        viewCount:
          type: integer
          format: int64
          description: 浏览量
          example: 1000000
        videoCount:
          type: integer
          format: int32
          description: 视频数量
          example: 5000
        createdAt:
          type: string
          description: 创建时间
          example: '2024-01-01 12:00:00'

    Music:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 音乐ID
          example: 456
        name:
          type: string
          description: 音乐名称
          example: 告白气球
        artist:
          type: string
          description: 艺术家
          example: 周杰伦
        album:
          type: string
          description: 专辑
          example: 依然范特西
        coverUrl:
          type: string
          format: uri
          description: 封面URL
          example: http://localhost:8089/static/image/cover.jpg
        musicUrl:
          type: string
          format: uri
          description: 音乐URL
          example: http://localhost:8089/static/audio/song.mp3
        duration:
          type: integer
          description: 音乐时长（秒）
          example: 200
        useCount:
          type: integer
          format: int32
          description: 被视频使用次数
          example: 10000
        createdAt:
          type: string
          description: 创建时间
          example: '2024-01-01 12:00:00'

    Conversation:
      type: object
      description: 会话（与某个用户的私信汇总）
      properties:
        targetUser:
          type: object
          description: 对方用户信息
          properties:
            id:
              type: integer
              format: int64
              description: 用户ID
              example: 456
            username:
              type: string
              description: 用户名
              example: zhangsan
            nickname:
              type: string
              description: 昵称
              example: 张三
            avatar:
              type: string
              format: uri
              description: 头像URL
              example: http://localhost:8089/static/image/avatar.jpg
        lastMessage:
          type: object
          description: 最后一条消息摘要
          properties:
            id:
              type: integer
              format: int64
              description: 消息ID
              example: 1001
            messageType:
              type: integer
              description: 消息类型：1-文本 2-图片 3-视频
              enum: [1, 2, 3]
              example: 1
            content:
              type: string
              description: 文本内容（非文本消息为空）
              example: 在吗？
            mediaUrl:
              type: string
              description: 媒体地址（文本消息为空）
              example: ''
            createdAt:
              type: string
              description: 发送时间
              example: '2024-01-01 12:00:00'
        unreadCount:
          type: integer
          description: 该会话未读消息数
          example: 3
        updatedAt:
          type: string
          description: 会话更新时间（最后消息时间）
          example: '2024-01-01 12:00:00'

    PlaylistInfo:
      type: object
      description: 播放列表信息
      properties:
        id:
          type: integer
          format: int64
          description: 播放列表ID
          example: 1
        title:
          type: string
          description: 标题
          example: 我最喜欢的视频
        description:
          type: string
          description: 描述
          example: 收藏的精彩视频
        coverUrl:
          type: string
          format: uri
          description: 封面URL
          example: https://cdn.flashvid.com/cover/playlist.jpg
        videoCount:
          type: integer
          format: int32
          description: 视频数量
          example: 12
        createdAt:
          type: string
          description: 创建时间（格式：2006-01-02 15:04:05）
          example: '2024-01-01 12:00:00'

    Message:
      type: object
      description: 私信消息
      properties:
        id:
          type: integer
          format: int64
          description: 消息ID
          example: 1001
        fromUserId:
          type: integer
          format: int64
          description: 发送方用户ID
          example: 123
        toUserId:
          type: integer
          format: int64
          description: 接收方用户ID
          example: 456
        messageType:
          type: integer
          description: 消息类型：1-文本 2-图片 3-视频
          enum: [1, 2, 3]
          example: 1
        content:
          type: string
          description: 文本内容（非文本消息为空）
          example: 在吗？
        mediaUrl:
          type: string
          description: 媒体地址（文本消息为空）
          example: ''
        isRead:
          type: boolean
          description: 是否已读
          example: false
        createdAt:
          type: string
          description: 发送时间
          example: '2024-01-01 12:00:00'


  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - type: object
                properties:
                  code:
                    example: 40000
                  message:
                    example: 请求参数错误
                  data:
                    example: null

    Unauthorized:
      description: 未登录或Token失效
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - type: object
                properties:
                  code:
                    example: 40001
                  message:
                    example: 未登录或Token失效
                  data:
                    example: null

    Forbidden:
      description: 无权限访问
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - type: object
                properties:
                  code:
                    example: 40003
                  message:
                    example: 无权限访问
                  data:
                    example: null

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - type: object
                properties:
                  code:
                    example: 40004
                  message:
                    example: 资源不存在
                  data:
                    example: null

    ValidationError:
      description: 请求参数验证失败
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - type: object
                properties:
                  code:
                    example: 42200
                  message:
                    example: 请求参数验证失败
                  data:
                    type: object
                    properties:
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                              example: username
                            message:
                              type: string
                              example: 用户名不能为空

    TooManyRequests:
      description: 请求过于频繁
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - type: object
                properties:
                  code:
                    example: 42900
                  message:
                    example: 请求过于频繁，请稍后再试
                  data:
                    type: object
                    properties:
                      retry_after:
                        type: integer
                        description: 重试间隔（秒）
                        example: 60

    InternalServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - type: object
                properties:
                  code:
                    example: 50000
                  message:
                    example: 服务器内部错误
                  data:
                    example: null

