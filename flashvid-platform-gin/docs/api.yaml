  # ==================== 评论模块 ====================
  /videos/{id}/comments:
    get:
      tags:
        - 评论
      summary: 获取视频评论列表
      description: 获取指定视频的评论列表（游标分页，按创建时间倒序）
      operationId: getVideoComments
      parameters:
        - name: id
          in: path
          required: true
          description: 视频ID
          schema:
            type: integer
            format: int64
        - name: cursor
          in: query
          description: 游标（上一页最后一条评论的创建时间，格式 2006-01-02 15:04:05），首次请求不传
          schema:
            type: string
            example: '2024-01-01 12:00:00'
        - name: count
          in: query
          description: 每页数量，默认10，最大50
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            example: 10
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          comments:
                            type: array
                            items:
                              $ref: '#/components/schemas/Comment'
                          nextCursorToken:
                            type: string
                            description: 下一页游标，hasMore为false时为空
                            example: '2024-01-01 11:00:00'
                          hasMore:
                            type: boolean
                            description: 是否还有更多
                            example: true
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - 评论
      summary: 发表评论
      description: 对指定视频发表一级评论或回复。parentId=0 时为一级评论，response 返回 comment；parentId>0 时为回复，response 返回 reply。
      operationId: createComment
      parameters:
        - name: id
          in: path
          required: true
          description: 视频ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: 评论内容
                  example: 这个视频太棒了！
                parentId:
                  type: integer
                  format: int64
                  description: 父评论ID，不传或传0表示一级评论
                  example: 0
                replyToUserId:
                  type: integer
                  format: int64
                  description: 被回复的用户ID（parentId>0时传入）
                  example: 123
      responses:
        '200':
          description: 评论成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          comment:
                            description: 一级评论（parentId=0时返回）
                            allOf:
                              - $ref: '#/components/schemas/Comment'
                            nullable: true
                          reply:
                            description: 回复（parentId>0时返回）
                            allOf:
                              - $ref: '#/components/schemas/Reply'
                            nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - BearerAuth: []

