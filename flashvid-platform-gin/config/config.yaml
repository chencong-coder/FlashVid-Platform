server:
  name: "flashvid-platform"
  mode: "dev"
  port: 8089
  version: "v0.0.1"

snowflake:
  start_time: "2026-07-19"
  machine_id: 1

jwt:
  access_secret: "夏天夏天悄悄过去留下小秘密"
  refresh_secret: "压心底压心底不能告诉你"
  access_expire_seconds: 3600
  refresh_expire_seconds: 86400

log:
  level: "info"
  filename: "log/server.log"
  max_size: 200
  max_age: 30
  max_backups: 7

mysql:
  host: 127.0.0.1
  port: 3306
  user: "root"
  password: "chencong"
  dbname: "flashvid_platform"
  max_open_conns: 200
  max_idle_conns: 50
  max_lifetime: 1h 

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0
  pool_size: 10

storage:
  local_path: "./uploads"                       # 文件存储根目录
  base_url: "http://localhost:8089/static"      # 静态文件访问基础 URL
  max_image_size: 10485760                      # 图片最大 10MB
  max_video_size: 524288000                     # 视频最大 500MB
  max_audio_size: 52428800                      # 音频最大 50MB